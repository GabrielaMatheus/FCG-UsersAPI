apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
data:
  ASPNETCORE_URLS: http://+:8080
  Jwt__Issuer: FiapCloudGames.UsersApi
  Jwt__Audience: FiapCloudGames
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: guest
---
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
type: Opaque
stringData:
  Jwt__SecretKey: CHANGE-ME-with-at-least-32-random-characters
  RabbitMq__Password: guest
  ConnectionStrings__UsersDatabase: Data Source=/data/users.db
  ADMIN_EMAIL: admin@fiap.com.br
  ADMIN_PASSWORD: CHANGE-ME-Admin-Password-123!
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-api-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      containers:
        - name: users-api
          image: fiapcloudgames/users-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: users-api-config
            - secretRef:
                name: users-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: users-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
spec:
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 8080
